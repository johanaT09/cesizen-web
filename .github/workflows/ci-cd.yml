name: CI

on:
  pull_request:
    branches: [dev]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le style (ESLint)
        run: npm run lint

      - name: Lancer les tests
        run: npm run test

      - name: Construire l'application (vérification)
        run: npm run build

      - name: Construire l'image Docker de production (vérification)
        run: docker build --target prod -t cesizen-web .