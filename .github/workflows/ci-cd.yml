name: CI/CD

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan des secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le style (ESLint)
        run: npm run lint

      - name: Auditer les dépendances npm
        run: npm audit --audit-level=high

      - name: Vérifier le Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Lancer les tests
        run: npm run test

      - name: Construire l'application (vérification)
        run: npm run build

      - name: Construire l'image Docker de production
        run: docker build --target prod -t cesizen-web .

      - name: Scanner l'image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cesizen-web
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ghcr.io/johanat09/cesizen-web:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Déployer sur le serveur
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/cesizen
            docker compose -f docker-compose.prod.yml --env-file .env pull front
            docker compose -f docker-compose.prod.yml --env-file .env up -d --no-deps front